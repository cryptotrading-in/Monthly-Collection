<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Monthly Collection</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}
*{box-sizing:border-box}body{margin:0;background:#f5f7fb}button{font:inherit;border:0}
.app{max-width:760px;margin:auto;min-height:100vh;padding:18px 16px 92px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
h1{font-size:22px;margin:0}.month{color:#667085;font-size:13px;margin-top:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#fff;border:1px solid #e7eaf0;border-radius:16px;padding:18px;box-shadow:0 2px 10px #10182808}
.stat:last-child{grid-column:1/-1}.label{font-size:12px;color:#667085;font-weight:600;text-transform:uppercase;letter-spacing:.04em}.value{font-size:30px;font-weight:750;margin-top:6px}
.quick{margin-top:22px}.quick h2{font-size:16px;margin:0 0 12px}.action{width:100%;background:#fff;border:1px solid #e7eaf0;border-radius:14px;padding:16px;text-align:left;margin-bottom:10px;font-weight:650;color:#172033}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e7eaf0;display:flex;justify-content:center;padding:9px 8px calc(9px + env(safe-area-inset-bottom));z-index:5}
nav button{background:transparent;color:#667085;padding:8px 16px;font-size:12px;font-weight:600}nav button.active{color:#2563eb}
@media(min-width:700px){.app{padding-top:28px}.stats{grid-template-columns:repeat(3,1fr)}.stat:last-child{grid-column:auto}}
.section{display:none}.section.active{display:block}.search{width:100%;padding:13px;border:1px solid #dfe3ea;border-radius:12px;background:#fff;margin:12px 0}.employee{display:flex;justify-content:space-between;background:#fff;border:1px solid #e7eaf0;border-radius:14px;padding:15px;margin-bottom:10px}.employee small{display:block;color:#667085;margin-top:4px}.badge{font-size:11px;font-weight:700;color:#16834b;background:#ecfdf3;border-radius:99px;padding:6px 9px}.fab{position:fixed;right:18px;bottom:82px;width:52px;height:52px;border-radius:50%;background:#2563eb;color:#fff;font-size:25px}.form{display:none;background:#fff;border:1px solid #e7eaf0;border-radius:16px;padding:16px;margin-top:12px}.form.show{display:block}.form label{display:block;font-size:12px;margin:10px 0 5px}.form input,.form select{width:100%;padding:12px;border:1px solid #dfe3ea;border-radius:11px}.save{width:100%;margin-top:15px;padding:13px;border-radius:11px;background:#2563eb;color:#fff;font-weight:700}</style>
</head>
<body>
<main class="app">
<header><div><h1>Monthly Collection</h1><div class="month">September 2026</div></div><button aria-label="More">⋮</button></header>
<section class="stats" aria-label="Payment status">
<div class="card stat"><div class="label">Total Employees</div><div class="value" id="totalEmployees">0</div></div>
<div class="card stat"><div class="label">Payment Received</div><div class="value" id="receivedCount">0</div></div>
<div class="card stat"><div class="label">Payment Pending</div><div class="value" id="pendingCount">0</div></div>
</section>
<section class="quick"><h2>Quick Actions</h2>
<button class="action">💰 Monthly Collection</button>
<button class="action">👤 Add Employee</button>
<button class="action">🧮 Leave Calculator</button>
</section><section id="employees" class="section"><h2>Employees</h2><div id="activeCount" class="month">0 Active</div><input id="search" class="search" placeholder="🔍 Search Force No or Name" oninput="renderEmployees()"><div id="employeeList"></div><button class="fab" onclick="toggleForm()">+</button><div id="employeeForm" class="form"><h2>Add Employee</h2><label>Force No</label><input id="forceNo"><label>Rank</label><select id="rank"><option value="">Select rank</option><option>DD</option><option>AD</option><option>INSP</option><option>SI</option><option>ASI</option><option>HC</option><option>PC</option></select><label>Name</label><input id="name"><button class="save" onclick="addEmployee()">Save Employee</button></div></section><section id="collection" class="section"><h2>Monthly Collection</h2><div class="card" style="margin-bottom:12px"><label style="font-size:12px;font-weight:700;color:#667085">MONTH</label><select id="monthSelect" style="width:100%;padding:12px;border:1px solid #dfe3ea;border-radius:11px;margin-top:7px;background:#fff"><option>September 2026</option></select></div><input id="collectionSearch" class="search" placeholder="🔍 Search employee"><div id="collectionList"></div></section></main><nav><button id="nav-home" class="active" onclick="show('home')">⌂<br>Home</button><button id="nav-employees" onclick="show('employees')">♙<br>Employees</button><button id="nav-collection" onclick="show('collection')">▣<br>Collection</button><button>☰<br>Menu</button></nav>
<script>
let employees=JSON.parse(localStorage.getItem('mc_employees')||'[]');
let editId=null;

function save(){localStorage.setItem('mc_employees',JSON.stringify(employees));renderEmployees();updateHome();}
function show(id){
 document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
 if(id==='home'){document.querySelector('.stats').style.display='grid';document.querySelector('.quick').style.display='block';}
 else{document.querySelector('.stats').style.display='none';document.querySelector('.quick').style.display='none';document.getElementById(id).classList.add('active');}
 document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
 const n=document.getElementById('nav-'+id);if(n)n.classList.add('active');
 if(id==='employees')renderEmployees();
}
function toggleForm(){
 editId=null;document.querySelector('#employeeForm h2').textContent='Add Employee';
 document.querySelector('.save').textContent='Save Employee';
 document.getElementById('employeeForm').classList.toggle('show');
}
function renderEmployees(){
 const q=(document.getElementById('search')?.value||'').toLowerCase();
 const list=employees.filter(e=>(e.forceNo+' '+e.name).toLowerCase().includes(q));
 document.getElementById('activeCount').textContent=employees.filter(e=>e.active).length+' Active';
 document.getElementById('employeeList').innerHTML=list.length?list.map(e=>`
 <div class="employee">
  <div><strong>${e.name}</strong><small>${e.rank} • Force No: ${e.forceNo}</small><small>${e.active?'Active':'Inactive'}</small></div>
  <div style="display:flex;gap:6px;align-items:flex-start">
   <button onclick="editEmployee('${e.id}')" style="padding:7px 9px;border:1px solid #dfe3ea;border-radius:9px;background:#fff">Edit</button>
   <button onclick="toggleEmployee('${e.id}')" style="padding:7px 9px;border:1px solid #dfe3ea;border-radius:9px;background:#fff">${e.active?'Deactivate':'Activate'}</button>
  </div>
 </div>`).join(''):'<div class="card"><div class="month">No employees found.</div></div>';
}
function addEmployee(){
 const force=document.getElementById('forceNo').value.trim(),rank=document.getElementById('rank').value,name=document.getElementById('name').value.trim();
 if(!force||!rank||!name){alert('Please fill Force No, Rank and Name.');return;}
 if(employees.some(e=>e.forceNo.toLowerCase()===force.toLowerCase()&&e.id!==editId)){alert('This Force No already exists.');return;}
 if(editId){
  const e=employees.find(x=>x.id===editId);Object.assign(e,{forceNo,rank,name});
 }else employees.push({id:Date.now().toString(),forceNo,rank,name,active:true});
 save();document.getElementById('employeeForm').classList.remove('show');clearForm();
}
function editEmployee(id){
 const e=employees.find(x=>x.id===id);if(!e)return;editId=id;
 document.querySelector('#employeeForm h2').textContent='Edit Employee';document.querySelector('.save').textContent='Update Employee';
 document.getElementById('forceNo').value=e.forceNo;document.getElementById('rank').value=e.rank;document.getElementById('name').value=e.name;
 document.getElementById('employeeForm').classList.add('show');window.scrollTo({top:0,behavior:'smooth'});
}
function clearForm(){document.getElementById('forceNo').value='';document.getElementById('rank').value='';document.getElementById('name').value='';editId=null;}
function toggleEmployee(id){
 const e=employees.find(x=>x.id===id);if(!e)return;
 e.active=!e.active;save();
}
function updateHome(){
 const active=employees.filter(e=>e.active).length;
 document.getElementById('totalEmployees').textContent=active;
 document.getElementById('pendingCount').textContent=active;
 document.getElementById('receivedCount').textContent=0;
}
document.addEventListener('DOMContentLoaded',()=>{updateHome();});
</script><script>const collectionKey="mc_collection_2026_09";
let collections=JSON.parse(localStorage.getItem(collectionKey)||"{}");
function recordFor(id){return collections[id]||{contribution:0,leave:0,received:0}}
function renderCollection(){const q=(document.getElementById("collectionSearch")?.value||"").toLowerCase();const active=employees.filter(e=>e.active&&(e.name+" "+e.forceNo).toLowerCase().includes(q));const box=document.getElementById("collectionList");box.innerHTML="";active.forEach(e=>{const r=recordFor(e.id),mess=Math.max(0,7000-(+r.leave||0)),total=(+r.contribution||0)+mess,rec=+r.received||0,rem=Math.max(0,total-rec),status=rec>=total&&total>0?"Received":rec>0?"Partial":"Pending";const d=document.createElement("div");d.className="card";d.style.marginBottom="10px";d.innerHTML="<div style=\"display:flex;justify-content:space-between\"><div><strong>"+e.name+"</strong><div class=\"month\">"+e.rank+" • "+e.forceNo+"</div></div><span class=\"badge\">"+status+"</span></div><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px;font-size:13px\"><div>Contribution<br><strong>Rs "+(+r.contribution||0).toLocaleString()+"</strong></div><div>Mess<br><strong>Rs "+mess.toLocaleString()+"</strong></div><div>Grand Total<br><strong>Rs "+total.toLocaleString()+"</strong></div><div>Remaining<br><strong>Rs "+rem.toLocaleString()+"</strong></div></div>";const b=document.createElement("button");b.textContent="Enter / Update Collection";b.style.cssText="width:100%;margin-top:13px;padding:11px;border:1px solid #dfe3ea;border-radius:10px;background:#fff";b.onclick=()=>editCollection(e.id);d.appendChild(b);box.appendChild(d)})}
function editCollection(id){const r=recordFor(id);const contribution=prompt("Contribution amount:",r.contribution);if(contribution===null)return;const leave=prompt("Leave amount:",r.leave);if(leave===null)return;const received=prompt("Received money:",r.received);if(received===null)return;collections[id]={contribution:Math.max(0,+contribution||0),leave:Math.max(0,+leave||0),received:Math.max(0,+received||0)};localStorage.setItem(collectionKey,JSON.stringify(collections));renderCollection();updateHomeCollection()}
function updateHomeCollection(){let received=0,pending=0;employees.filter(e=>e.active).forEach(e=>{const r=recordFor(e.id),mess=Math.max(0,7000-(+r.leave||0)),total=(+r.contribution||0)+mess,rec=+r.received||0;if(total>0&&rec>=total)received++;else pending++});document.getElementById("receivedCount").textContent=received;document.getElementById("pendingCount").textContent=pending}
document.getElementById("collectionSearch").addEventListener("input",renderCollection);
const originalShow=show;show=function(id){originalShow(id);if(id==="collection")renderCollection();updateHomeCollection()};updateHomeCollection();</script></body>
</html>
