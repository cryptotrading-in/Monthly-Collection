<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Monthly Collection</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}
*{box-sizing:border-box}body{margin:0;background:#f5f7fb}button{font:inherit;border:0}
.app{max-width:760px;margin:auto;min-height:100vh;padding:18px 16px 92px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
h1{font-size:22px;margin:0}.month{color:#667085;font-size:13px;margin-top:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#fff;border:1px solid #e7eaf0;border-radius:16px;padding:18px;box-shadow:0 2px 10px #10182808}
.stat:last-child{grid-column:1/-1}.label{font-size:12px;color:#667085;font-weight:600;text-transform:uppercase;letter-spacing:.04em}.value{font-size:30px;font-weight:750;margin-top:6px}
.quick{margin-top:22px}.quick h2{font-size:16px;margin:0 0 12px}.action{width:100%;background:#fff;border:1px solid #e7eaf0;border-radius:14px;padding:16px;text-align:left;margin-bottom:10px;font-weight:650;color:#172033}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e7eaf0;display:flex;justify-content:center;padding:9px 8px calc(9px + env(safe-area-inset-bottom));z-index:5}
nav button{background:transparent;color:#667085;padding:8px 16px;font-size:12px;font-weight:600}nav button.active{color:#2563eb}
@media(min-width:700px){.app{padding-top:28px}.stats{grid-template-columns:repeat(3,1fr)}.stat:last-child{grid-column:auto}}
.section{display:none}.section.active{display:block}.search{width:100%;padding:13px;border:1px solid #dfe3ea;border-radius:12px;background:#fff;margin:12px 0}.employee{display:flex;justify-content:space-between;background:#fff;border:1px solid #e7eaf0;border-radius:14px;padding:15px;margin-bottom:10px}.employee small{display:block;color:#667085;margin-top:4px}.badge{font-size:11px;font-weight:700;color:#16834b;background:#ecfdf3;border-radius:99px;padding:6px 9px}.fab{position:fixed;right:18px;bottom:82px;width:52px;height:52px;border-radius:50%;background:#2563eb;color:#fff;font-size:25px}.form{display:none;background:#fff;border:1px solid #e7eaf0;border-radius:16px;padding:16px;margin-top:12px}.form.show{display:block}.form label{display:block;font-size:12px;margin:10px 0 5px}.form input,.form select{width:100%;padding:12px;border:1px solid #dfe3ea;border-radius:11px}.save{width:100%;margin-top:15px;padding:13px;border-radius:11px;background:#2563eb;color:#fff;font-weight:700}</style>
</head>
<body>
<main class="app">
<header><div><h1>Monthly Collection</h1><div class="month">September 2026</div></div><button aria-label="More">⋮</button></header>
<section class="stats" aria-label="Payment status">
<div class="card stat"><div class="label">Total Employees</div><div class="value" id="totalEmployees">0</div></div>
<div class="card stat"><div class="label">Payment Received</div><div class="value" id="receivedCount">0</div></div>
<div class="card stat"><div class="label">Payment Pending</div><div class="value" id="pendingCount">0</div></div>
</section>
<section class="quick"><h2>Quick Actions</h2>
<button class="action">💰 Monthly Collection</button>
<button class="action">👤 Add Employee</button>
<button class="action">🧮 Leave Calculator</button>
</section><section id="employees" class="section"><h2>Employees</h2><div id="activeCount" class="month">0 Active</div><input id="search" class="search" placeholder="🔍 Search Force No or Name" oninput="renderEmployees()"><div id="employeeList"></div><button class="fab" onclick="toggleForm()">+</button><div id="employeeForm" class="form"><h2>Add Employee</h2><label>Force No</label><input id="forceNo"><label>Rank</label><select id="rank"><option value="">Select rank</option><option>DD</option><option>AD</option><option>INSP</option><option>SI</option><option>ASI</option><option>HC</option><option>PC</option></select><label>Name</label><input id="name"><button class="save" onclick="addEmployee()">Save Employee</button></div></section><section id="collection" class="section"><h2>Monthly Collection</h2><div class="card">September 2026<br><span class="month">Collection module next.</span></div></section></main><nav><button id="nav-home" class="active" onclick="show('home')">⌂<br>Home</button><button id="nav-employees" onclick="show('employees')">♙<br>Employees</button><button id="nav-collection" onclick="show('collection')">▣<br>Collection</button><button>☰<br>Menu</button></nav>
</body>
</html>
